[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests
# The repository root, so tests can import scripts/ (the docs gate) under plain `pytest`.
pythonpath = .

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

markers =
    requires_openscad: Test requires OpenSCAD to be installed

timeout = 600
timeout_method = thread
